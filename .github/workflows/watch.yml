# 주 트리거는 cron-job.org 가 보내는 repository_dispatch(5분 주기)다.
# 한 번 깨어나면 워크플로 안에서 60초 간격으로 4회 감시하고 종료한다.
# 러너 부팅(30~40초) 비용을 4회에 분산시키기 위해서다.
# GitHub 자체 schedule 은 cron-job.org 장애 대비 안전망으로만 둔다.
name: watch

on:
  repository_dispatch:
    types: [poll]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write        # state.json 커밋용

concurrency:
  group: watch
  cancel-in-progress: false   # 실행 중 취소하면 state 커밋을 잃는다

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 감시 실행 (60초 간격으로 4분간)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          timeout 240 python watcher.py --loop 60
          code=$?
          # 124 = timeout 이 정상적으로 끊은 것. 그 외 0 이 아니면 실패.
          if [ $code -ne 0 ] && [ $code -ne 124 ]; then
            echo "watcher 비정상 종료 (exit $code)"
            exit $code
          fi
          echo "감시 정상 종료 (exit $code)"

      # state.json 은 감시 기준선, config.json 은 텔레그램 봇으로 바꾼 설정.
      # 둘 다 남겨야 다음 실행이 이어진다.
      # 실행이 겹치면 두 러너가 각각 state.json 을 고친 뒤 동시에 올리려 한다.
      # rebase 는 이걸 자동으로 못 풀고 충돌로 죽으므로, 원격을 받아온 뒤
      # seen 을 합집합으로 병합하고 그 위에 새로 커밋한다.
      - name: 변경사항 커밋
        if: always()
        run: |
          rm -f state.json.tmp
          if git diff --quiet -- state.json config.json; then
            echo "변경 없음"
            exit 0
          fi

          # config.json 은 이번 실행에서 봇으로 바꿨을 때만 덮어쓴다.
          # (안 바꿨는데 덮으면 다른 실행이 추가한 감시 대상을 지우게 된다)
          CONFIG_CHANGED=$(git diff --name-only -- config.json)
          cp state.json  /tmp/ours-state.json
          cp config.json /tmp/ours-config.json

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 재시도 간격. 3초로 세 번이면 10초 안에 끝나버려서, GitHub 쪽
          # 일시 장애(Internal Server Error)를 넘기지 못하고 실패했다.
          BACKOFF="5 15 30"
          attempt=0
          for wait in $BACKOFF; do
            attempt=$((attempt + 1))

            if ! git fetch -q origin "${GITHUB_REF_NAME}"; then
              echo "fetch 실패. ${wait}초 뒤 다시 시도 ($attempt/3)"
              sleep "$wait"
              continue
            fi
            if ! git reset -q --hard "origin/${GITHUB_REF_NAME}"; then
              echo "reset 실패. ${wait}초 뒤 다시 시도 ($attempt/3)"
              sleep "$wait"
              continue
            fi

            # 병합 전 원격 상태를 떠둔다. 아래에서 '커밋할 가치가 있나'를
            # 이것과 비교해서 판단한다.
            git show HEAD:state.json > /tmp/base-state.json 2>/dev/null \
              || echo '{}' > /tmp/base-state.json

            # config 를 먼저 제자리에 돌려놓는다. merge_state 가 이 파일을
            # 읽어서 삭제된 감시 대상의 기준선 기록을 걸러내기 때문에,
            # 순서가 바뀌면 방금 추가한 대상의 기준선이 지워질 수 있다.
            if [ -n "$CONFIG_CHANGED" ]; then
              cp /tmp/ours-config.json config.json
            fi
            python merge_state.py /tmp/ours-state.json state.json

            if git diff --quiet -- state.json config.json; then
              echo "병합 결과가 원격과 같음. 커밋 불필요"
              exit 0
            fi

            # 점검 횟수(run_no)와 마지막 점검 시각만 바뀐 커밋은 남기지
            # 않는다. 5분마다 그것만 커밋하다가 main 에 커밋이 2만 개 넘게
            # 쌓였고, 커밋마다 GitHub Pages 까지 다시 빌드됐다.
            if [ -z "$CONFIG_CHANGED" ] \
               && ! python merge_state.py --changed /tmp/base-state.json state.json; then
              echo "점검 횟수만 바뀜. 커밋 생략"
              exit 0
            fi

            git add state.json config.json
            git commit -q -m "state: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "커밋 완료 (시도 $attempt)"
              exit 0
            fi
            echo "push 실패. ${wait}초 뒤 다시 시도 ($attempt/3)"
            sleep "$wait"
          done
          echo "3회 시도 후에도 push 실패"
          exit 1
