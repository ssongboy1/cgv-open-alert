# CGV 직접 조회가 지금 되는지, 실제 클라이언트 그대로 확인한다.
# 주의: 예전 판은 User-Agent 만 보내서 늘 403 이 났다. 9월에 추가한
# BROWSER_HINTS(sec-ch-ua / Sec-Fetch) 를 빠뜨렸기 때문이다. 그래서
# "차단됨"으로 보였을 뿐 실제 감시기의 상태가 아니었다.
# 이제 cgv_api 의 함수를 그대로 호출한다.
name: smoke-test

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: CGV 직접 조회 상태 확인
        run: |
          python - <<'PY'
          import datetime
          import cgv_api

          DAEGU = "0345"
          TODAY = datetime.datetime.now(
              datetime.timezone(datetime.timedelta(hours=9))).strftime("%Y%m%d")
          TARGET = "20261216"

          print("UA        :", cgv_api.UA[:70])
          print("추가 헤더 :", ", ".join(sorted(cgv_api.BROWSER_HINTS)))
          print()

          def tryit(label, fn):
              try:
                  out = fn()
              except Exception as e:
                  print(f"{label:30} 실패  {type(e).__name__}: {str(e)[:160]}")
                  return None
              print(f"{label:30} OK    {str(out)[:260]}")
              return out

          tryit("1 지역 목록", cgv_api.get_regions)
          tryit("2 대구 특별관", lambda: cgv_api.get_special_screens(DAEGU))
          tryit("3 대구 열린 날짜", lambda: cgv_api.get_open_dates(DAEGU))
          tryit(f"4 대구 시간표 {TODAY}", lambda: cgv_api.get_schedules(DAEGU, TODAY))
          tryit(f"5 대구 시간표 {TARGET}", lambda: cgv_api.get_schedules(DAEGU, TARGET))

          print("\n확인 끝. 사실만 기록하고 실패로 끝내지 않는다.")
          PY

  # 제3자 중계 API(daiso, mcp.aka.page)가 Actions 에서 동작하는지 1회 확인.
  # 채택 여부를 판단하기 위한 사실 확인이며, 상시 사용하지 않는다.
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: 중계 API 동작 확인
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error

          BASE = "https://mcp.aka.page"
          UA = "cgv-open-alert-probe/1.0"
          TODAY = "20261104"      # 대조군: 지금 열려 있는 날
          TARGET = "20261216"     # 듄3 개봉일
          DAEGU = "0345"          # CGV 대구

          def get(path):
              req = urllib.request.Request(
                  BASE + path,
                  headers={"User-Agent": UA, "Accept": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      return r.status, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()[:400]
              except Exception as e:
                  return None, repr(e).encode()

          def show(label, path):
              code, raw = get(path)
              print("=" * 70)
              print(f"{label}\n  GET {path}\n  HTTP {code}  {len(raw)} bytes")
              try:
                  doc = json.loads(raw)
              except Exception:
                  print("  (JSON 아님) " + raw[:300].decode("utf-8", "replace"))
                  return None
              print(f"  success={doc.get('success')}  keys={list(doc)[:6]}")
              data = doc.get("data", doc)
              text = json.dumps(data, ensure_ascii=False)
              print(f"  data 길이 {len(text)}자")
              print("  " + text[:700])
              for word in ("듄", "DUNE", "Dune"):
                  if word in text:
                      print(f"  >>> '{word}' 발견")
              return doc

          show("1. 중계 살아있나 (극장 목록)",
               f"/api/cgv/theaters?playDate={TODAY}")
          show("2. 대조군: 오늘 대구 영화 목록",
               f"/api/cgv/movies?playDate={TODAY}&theaterCode={DAEGU}")
          show("3. 대조군: 오늘 대구 시간표",
               f"/api/cgv/timetable?playDate={TODAY}&theaterCode={DAEGU}")
          show("4. 본 질문: 12/16 대구 영화 목록",
               f"/api/cgv/movies?playDate={TARGET}&theaterCode={DAEGU}")
          show("5. 본 질문: 12/16 대구 시간표",
               f"/api/cgv/timetable?playDate={TARGET}&theaterCode={DAEGU}")
          print("=" * 70)
          print("확인 끝. 이 작업은 실패로 끝나지 않는다 — 사실만 기록한다.")
          PY
