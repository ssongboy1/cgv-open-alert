# Actions IP에서 CGV가 403을 주는지 확인한다.
# watch.yml 을 켜기 전에 이것부터 수동 실행할 것.
name: smoke-test

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: CGV 접근 가능 여부 확인
        run: |
          python - <<'PY'
          import urllib.request, urllib.error

          URL = ("https://cgv.co.kr/api/v1/booking/"
                 "searchSscnsSchdExistList?coCd=A420&siteNo=0013")

          def probe(label, ua):
              req = urllib.request.Request(URL, headers={"User-Agent": ua})
              try:
                  with urllib.request.urlopen(req, timeout=10) as r:
                      body = r.read(160).decode("utf-8", "replace")
                      print(f"{label:24} {r.status}  {body}")
                      return r.status
              except urllib.error.HTTPError as e:
                  print(f"{label:24} {e.code}  (차단)")
                  return e.code

          import cgv_api
          ok = probe("브라우저 UA (실사용)", cgv_api.UA)
          probe("봇 UA (대조군)", "python-requests/2.32.0")

          if ok != 200:
              raise SystemExit(
                  "\n실패: Actions IP에서 CGV가 403을 반환합니다.\n"
                  "watch.yml 을 비활성화하고 로컬 실행으로 전환하세요.")
          print("\n성공: Actions에서 CGV 조회가 가능합니다. watch.yml 을 켜도 됩니다.")
          PY

  # 제3자 중계 API(daiso, mcp.aka.page)가 Actions 에서 동작하는지 1회 확인.
  # 채택 여부를 판단하기 위한 사실 확인이며, 상시 사용하지 않는다.
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: 중계 API 동작 확인
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error

          BASE = "https://mcp.aka.page"
          UA = "cgv-open-alert-probe/1.0"
          TODAY = "20261104"      # 대조군: 지금 열려 있는 날
          TARGET = "20261216"     # 듄3 개봉일
          DAEGU = "0345"          # CGV 대구

          def get(path):
              req = urllib.request.Request(
                  BASE + path,
                  headers={"User-Agent": UA, "Accept": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      return r.status, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()[:400]
              except Exception as e:
                  return None, repr(e).encode()

          def show(label, path):
              code, raw = get(path)
              print("=" * 70)
              print(f"{label}\n  GET {path}\n  HTTP {code}  {len(raw)} bytes")
              try:
                  doc = json.loads(raw)
              except Exception:
                  print("  (JSON 아님) " + raw[:300].decode("utf-8", "replace"))
                  return None
              print(f"  success={doc.get('success')}  keys={list(doc)[:6]}")
              data = doc.get("data", doc)
              text = json.dumps(data, ensure_ascii=False)
              print(f"  data 길이 {len(text)}자")
              print("  " + text[:700])
              for word in ("듄", "DUNE", "Dune"):
                  if word in text:
                      print(f"  >>> '{word}' 발견")
              return doc

          show("1. 중계 살아있나 (극장 목록)",
               f"/api/cgv/theaters?playDate={TODAY}")
          show("2. 대조군: 오늘 대구 영화 목록",
               f"/api/cgv/movies?playDate={TODAY}&theaterCode={DAEGU}")
          show("3. 대조군: 오늘 대구 시간표",
               f"/api/cgv/timetable?playDate={TODAY}&theaterCode={DAEGU}")
          show("4. 본 질문: 12/16 대구 영화 목록",
               f"/api/cgv/movies?playDate={TARGET}&theaterCode={DAEGU}")
          show("5. 본 질문: 12/16 대구 시간표",
               f"/api/cgv/timetable?playDate={TARGET}&theaterCode={DAEGU}")
          print("=" * 70)
          print("확인 끝. 이 작업은 실패로 끝나지 않는다 — 사실만 기록한다.")
          PY
