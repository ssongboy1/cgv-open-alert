# CGV 직접 조회가 지금 되는지, 실제 클라이언트 그대로 확인한다.
# 주의: 예전 판은 User-Agent 만 보내서 늘 403 이 났다. 9월에 추가한
# BROWSER_HINTS(sec-ch-ua / Sec-Fetch) 를 빠뜨렸기 때문이다. 그래서
# "차단됨"으로 보였을 뿐 실제 감시기의 상태가 아니었다.
# 이제 cgv_api 의 함수를 그대로 호출한다.
name: smoke-test

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: CGV 직접 조회 상태 확인
        run: |
          python - <<'PY'
          import datetime
          import cgv_api

          DAEGU = "0345"
          TODAY = datetime.datetime.now(
              datetime.timezone(datetime.timedelta(hours=9))).strftime("%Y%m%d")
          TARGET = "20261216"

          print("UA        :", cgv_api.UA[:70])
          print("추가 헤더 :", ", ".join(sorted(cgv_api.BROWSER_HINTS)))
          print()

          def tryit(label, fn):
              try:
                  out = fn()
              except Exception as e:
                  print(f"{label:30} 실패  {type(e).__name__}: {str(e)[:160]}")
                  return None
              print(f"{label:30} OK    {str(out)[:260]}")
              return out

          tryit("1 지역 목록", cgv_api.get_regions)
          tryit("2 대구 특별관", lambda: cgv_api.get_special_screens(DAEGU))
          tryit("3 대구 열린 날짜", lambda: cgv_api.get_open_dates(DAEGU))
          tryit(f"4 대구 시간표 {TODAY}", lambda: cgv_api.get_schedules(DAEGU, TODAY))
          tryit(f"5 대구 시간표 {TARGET}", lambda: cgv_api.get_schedules(DAEGU, TARGET))

          print("\n확인 끝. 사실만 기록하고 실패로 끝내지 않는다.")
          PY

      - name: 감시기 전체를 실제 CGV 로 1회 돌려보기 (알림 전송 없음)
        run: python watcher.py --dry-run

      - name: 지점번호와 아이맥스 편수 확인 (1회용)
        run: |
          python - <<'PY'
          import cgv_api

          WANT = ("센텀", "삼산", "울산", "대구", "용산")

          hits = []
          for regn in cgv_api.get_regions():
              for site in regn.get("siteList") or []:
                  nm = str(site.get("siteNm", ""))
                  if any(w in nm for w in WANT):
                      hits.append((regn.get("regnGrpNm"), site.get("siteNo"), nm,
                                   site.get("bzplcOperStusNm")))

          print("이름에 걸린 지점")
          for regn, no, nm, stus in sorted(hits, key=lambda h: h[1]):
              print("  {:6} {:4}  {:<18} {}".format(regn, no, nm, stus))

          print()
          print("각 지점 특별관 편수 (아이맥스 있는 곳만 쓸 수 있다)")
          for _regn, no, nm, _stus in sorted(hits, key=lambda h: h[1]):
              try:
                  rows = cgv_api.get_special_screens(no)
              except Exception as e:
                  print("  {:4} {:<18} 실패 {}".format(no, nm, type(e).__name__))
                  continue
              got = {r.get("comCdvalNm"): r.get("schdCnt") for r in rows}
              mark = "  <- 아이맥스" if "아이맥스" in got else ""
              print("  {:4} {:<18} {}{}".format(no, nm, got or "(없음)", mark))
              cgv_api._jitter()
          PY
