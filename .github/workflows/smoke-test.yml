# CGV 직접 조회가 지금 되는지, 실제 클라이언트 그대로 확인한다.
# 주의: 예전 판은 User-Agent 만 보내서 늘 403 이 났다. 9월에 추가한
# BROWSER_HINTS(sec-ch-ua / Sec-Fetch) 를 빠뜨렸기 때문이다. 그래서
# "차단됨"으로 보였을 뿐 실제 감시기의 상태가 아니었다.
# 이제 cgv_api 의 함수를 그대로 호출한다.
name: smoke-test

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: CGV 직접 조회 상태 확인
        run: |
          python - <<'PY'
          import datetime
          import cgv_api

          DAEGU = "0345"
          TODAY = datetime.datetime.now(
              datetime.timezone(datetime.timedelta(hours=9))).strftime("%Y%m%d")
          TARGET = "20261216"

          print("UA        :", cgv_api.UA[:70])
          print("추가 헤더 :", ", ".join(sorted(cgv_api.BROWSER_HINTS)))
          print()

          def tryit(label, fn):
              try:
                  out = fn()
              except Exception as e:
                  print(f"{label:30} 실패  {type(e).__name__}: {str(e)[:160]}")
                  return None
              print(f"{label:30} OK    {str(out)[:260]}")
              return out

          tryit("1 지역 목록", cgv_api.get_regions)
          tryit("2 대구 특별관", lambda: cgv_api.get_special_screens(DAEGU))
          tryit("3 대구 열린 날짜", lambda: cgv_api.get_open_dates(DAEGU))
          tryit(f"4 대구 시간표 {TODAY}", lambda: cgv_api.get_schedules(DAEGU, TODAY))
          tryit(f"5 대구 시간표 {TARGET}", lambda: cgv_api.get_schedules(DAEGU, TARGET))

          print("\n확인 끝. 사실만 기록하고 실패로 끝내지 않는다.")
          PY

      - name: 감시기 전체를 실제 CGV 로 1회 돌려보기 (알림 전송 없음)
        run: python watcher.py --dry-run

      - name: 어벤져스·듄3 현황 확인 (1회용)
        run: |
          python - <<'PY'
          import cgv_api

          WANT = ("어벤져스", "둠스데이", "듄", "아바타")
          try:
              playing = cgv_api.get_now_playing()
          except Exception as e:
              print("예매 목록 실패:", type(e).__name__, str(e)[:120])
              playing = []

          print("예매 목록 {}편".format(len(playing)))
          print("상위 10편:")
          for m in playing[:10]:
              print("   {:<36} 예매율 {}".format(
                  str(m.get("movNm"))[:36], m.get("atktRate")))
          print()
          print("찾는 영화:")
          for w in WANT:
              hit = [(m.get("movNo"), m.get("movNm"), m.get("atktRate"))
                     for m in playing if w in str(m.get("movNm"))]
              print("   {:8} -> {}".format(w, hit or "목록에 없음"))

          print()
          print("지점별 특별관 편수")
          for site, nm in (("0089", "센텀시티"), ("0128", "울산삼산"),
                           ("0345", "대구"), ("0013", "용산아이파크몰")):
              try:
                  rows = cgv_api.get_special_screens(site)
                  got = {r.get("comCdvalNm"): r.get("schdCnt") for r in rows}
                  print("   {:4} {:<14} {}".format(site, nm, got or "(없음)"))
              except Exception as e:
                  print("   {:4} {:<14} 실패 {}".format(site, nm, type(e).__name__))
              cgv_api._jitter()
          PY
