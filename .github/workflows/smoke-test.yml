# CGV 직접 조회가 지금 되는지, 실제 클라이언트 그대로 확인한다.
# 주의: 예전 판은 User-Agent 만 보내서 늘 403 이 났다. 9월에 추가한
# BROWSER_HINTS(sec-ch-ua / Sec-Fetch) 를 빠뜨렸기 때문이다. 그래서
# "차단됨"으로 보였을 뿐 실제 감시기의 상태가 아니었다.
# 이제 cgv_api 의 함수를 그대로 호출한다.
name: smoke-test

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: CGV 직접 조회 상태 확인
        run: |
          python - <<'PY'
          import datetime
          import cgv_api

          DAEGU = "0345"
          TODAY = datetime.datetime.now(
              datetime.timezone(datetime.timedelta(hours=9))).strftime("%Y%m%d")
          TARGET = "20261216"

          print("UA        :", cgv_api.UA[:70])
          print("추가 헤더 :", ", ".join(sorted(cgv_api.BROWSER_HINTS)))
          print()

          def tryit(label, fn):
              try:
                  out = fn()
              except Exception as e:
                  print(f"{label:30} 실패  {type(e).__name__}: {str(e)[:160]}")
                  return None
              print(f"{label:30} OK    {str(out)[:260]}")
              return out

          tryit("1 지역 목록", cgv_api.get_regions)
          tryit("2 대구 특별관", lambda: cgv_api.get_special_screens(DAEGU))
          tryit("3 대구 열린 날짜", lambda: cgv_api.get_open_dates(DAEGU))
          tryit(f"4 대구 시간표 {TODAY}", lambda: cgv_api.get_schedules(DAEGU, TODAY))
          tryit(f"5 대구 시간표 {TARGET}", lambda: cgv_api.get_schedules(DAEGU, TARGET))

          print("\n확인 끝. 사실만 기록하고 실패로 끝내지 않는다.")
          PY

  # 1회용: 중계 API 의 502 가 "아직 안 열린 날짜"를 뜻하는지 확인한다.
  # 우리 자신의 열린날짜 목록(11/04 측정)과 교차검증한다.
  relay-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: 중계 API 날짜 경계 확인
        run: |
          python - <<'PY'
          import json, time, urllib.request, urllib.error

          BASE = "https://mcp.aka.page"
          DAEGU = "0345"

          # 2026-11-04 21:16 KST, 우리 클라이언트로 측정한 대구 열린 날짜
          OPEN = {"20261104", "20261105", "20261106", "20261107", "20261108",
                  "20261110", "20261111", "20261113", "20261114", "20261115",
                  "20261121", "20261229"}

          DATES = [
              ("20261105", "내일"),
              ("20261109", "우리 목록에 없는 날"),
              ("20261115", "목록 마지막 연속일"),
              ("20261121", "목록의 외딴 날"),
              ("20261125", "목록에 없는 날"),
              ("20261216", "듄3 개봉일"),
              ("20261229", "목록의 외딴 날"),
          ]

          print(f"{'날짜':10} {'우리목록':6} {'중계':6} {'회차':>4}  비고")
          print("-" * 64)

          for date, note in DATES:
              path = f"/api/cgv/timetable?playDate={date}&theaterCode={DAEGU}"
              req = urllib.request.Request(BASE + path, headers={
                  "User-Agent": "cgv-open-alert-probe/1.0",
                  "Accept": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      code, raw = r.status, r.read()
              except urllib.error.HTTPError as e:
                  code, raw = e.code, e.read()[:400]
              except Exception as e:
                  code, raw = None, repr(e).encode()

              mine = "열림" if date in OPEN else "없음"
              rows, extra = "-", ""
              try:
                  doc = json.loads(raw)
                  if doc.get("success"):
                      tt = doc.get("data", {}).get("timetable") or []
                      rows = len(tt)
                      names = sorted({t.get("movieName", "") for t in tt})
                      if any("듄" in n or "DUNE" in n.upper() for n in names):
                          extra = "  >>> 듄 있음!"
                      elif names:
                          extra = "  예: " + names[0][:22]
                  else:
                      extra = "  " + str(doc.get("error", {}).get("code", ""))
              except Exception:
                  extra = "  (JSON 아님)"

              print(f"{date:10} {mine:6} {str(code):6} {str(rows):>4}{extra}")
              time.sleep(0.4)

          print("-" * 64)
          print("우리목록과 중계 결과가 일치하면 502 는 '안 열린 날짜'를 뜻한다.")
          PY
