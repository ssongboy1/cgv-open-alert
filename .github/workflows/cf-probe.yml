name: cf-probe
on:
  workflow_dispatch:
  push:
    branches: [claude/booking-notification-timing-issue-cea2cj]
    paths: [cf_probe.py]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python cf_probe.py
